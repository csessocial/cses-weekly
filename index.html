<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly 위클리 회의 자료</title>
<style>
:root{
  --primary:#0075de;
  --primary-active:#005bab;
  --secondary:#213183;
  --on-primary:#ffffff;
  --canvas:#ffffff;
  --canvas-soft:#f6f5f4;
  --surface:#ffffff;
  --ink:#000000;
  --ink-secondary:#31302e;
  --ink-muted:#615d59;
  --ink-faint:#a39e98;
  --hairline:#e6e6e6;
  --accent-sky:#62aef0;
  --accent-purple:#d6b6f6;
  --accent-purple-deep:#391c57;
  --accent-pink:#ff64c8;
  --accent-orange:#dd5b00;
  --accent-orange-deep:#793400;
  --accent-teal:#2a9d99;
  --accent-green:#1aae39;
  --accent-brown:#523410;

  --r-xs:4px; --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  --sp-xxs:4px; --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:28px; --sp-xxl:32px;

  --shadow-1: 0 0.175px 1.041px rgba(0,0,0,0.01), 0 0.8px 2.925px rgba(0,0,0,0.02), 0 2.025px 7.847px rgba(0,0,0,0.027), 0 4px 18px rgba(0,0,0,0.04);
  --shadow-2: 0 1px 2px rgba(0,0,0,0.03), 0 4px 10px rgba(0,0,0,0.04), 0 12px 24px rgba(0,0,0,0.04), 0 23px 52px rgba(0,0,0,0.05);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas-soft);
  color:var(--ink);
  font-family:Inter,-apple-system,system-ui,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.page{max-width:1300px;margin:0 auto;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--canvas);
  border-bottom:1px solid var(--hairline);
  padding:var(--sp-md) var(--sp-lg);
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);
  flex-wrap:wrap;
}
.topbar-left{display:flex;align-items:baseline;gap:var(--sp-md);flex-wrap:wrap;}
.brand{
  font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-0.125px;
  color:var(--ink);
}
.brand b{color:var(--primary);}
.week-nav{display:flex;align-items:center;gap:var(--sp-xs);}
.week-label{
  font-size:15px;font-weight:400;color:var(--ink-muted);
  min-width:190px;text-align:center;
}
.icon-btn{
  width:28px;height:28px;border-radius:var(--r-full);
  border:1px solid var(--hairline);background:var(--surface);
  color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;
}
.icon-btn:hover{background:var(--canvas-soft);color:var(--ink);}
.topbar-right{display:flex;gap:var(--sp-sm);align-items:center;}

.btn{
  font-size:16px;font-weight:500;line-height:1.5;letter-spacing:0;
  border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform .08s ease,background .12s ease;
}
.btn:active{transform:scale(0.96);}
.btn-primary{
  background:var(--primary);color:var(--on-primary);
  border-radius:var(--r-full);padding:10px 22px;
}
.btn-primary:hover{background:var(--primary-active);}
.btn-secondary{
  background:var(--surface);color:var(--ink);
  border-radius:var(--r-full);padding:10px 22px;
  box-shadow:var(--shadow-1);
}
.btn-utility{
  background:var(--surface);color:var(--ink);
  border-radius:var(--r-md);padding:4px 14px;
  border:1px solid var(--hairline);font-size:15px;
}
.btn-utility:hover{background:var(--canvas-soft);}
.btn-ghost{
  background:transparent;color:var(--primary);
  padding:4px 6px;font-size:14px;font-weight:600;border-radius:var(--r-sm);
}
.btn-ghost:hover{background:rgba(0,117,222,0.08);}

/* ---------- Banner ---------- */
.banner{
  margin:var(--sp-lg) var(--sp-lg) 0;
  background:#eaf3fd;
  border:1px solid #d3e7fb;
  border-radius:var(--r-lg);
  padding:var(--sp-sm) var(--sp-md);
  display:flex;align-items:flex-start;gap:var(--sp-sm);
  font-size:15px;line-height:1.33;color:var(--secondary);
}
.banner .dot{
  flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-full);
  background:var(--primary);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}

/* ---------- Layout ---------- */
.layout{
  display:grid;grid-template-columns:1fr 340px;gap:var(--sp-lg);
  padding:var(--sp-lg);align-items:start;
}
.main-col{display:flex;flex-direction:column;gap:var(--sp-xxl);}
.side-col{display:flex;flex-direction:column;gap:var(--sp-lg);position:sticky;top:88px;}

.section-head{margin-bottom:var(--sp-md);}
.eyebrow{
  font-size:12px;font-weight:600;line-height:1.33;letter-spacing:0.125px;
  color:var(--primary);text-transform:uppercase;margin:0 0 4px;
}
.section-title{
  font-size:26px;font-weight:700;line-height:1.23;letter-spacing:-0.625px;margin:0;
  color:var(--ink);
}
.section-sub{
  font-size:15px;color:var(--ink-muted);margin:6px 0 0;
}

/* ---------- Card grid ---------- */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-md);}
.card{
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--r-lg);
  padding:var(--sp-lg);
}
.card-title{
  font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-0.125px;
  margin:0 0 var(--sp-sm);color:var(--ink);
}

/* ---------- Editable list ---------- */
.item-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:8px;}
.item-num{
  flex:0 0 auto;color:var(--ink-faint);font-size:15px;line-height:1.6;
  min-width:16px;
}
.item-row input[type="text"]{
  flex:1 1 auto;
  border:none;border-bottom:1px solid transparent;
  background:transparent;font-family:inherit;
  font-size:15px;line-height:1.5;color:var(--ink);
  padding:4px 2px;border-radius:var(--r-xs);
}
.item-row input[type="text"]::placeholder{color:var(--ink-faint);}
.item-row input[type="text"]:hover{background:var(--canvas-soft);}
.item-row input[type="text"]:focus{
  outline:none;background:var(--canvas-soft);
  box-shadow:0 0 0 2px rgba(0,117,222,0.15);
}
.item-remove{
  flex:0 0 auto;width:20px;height:20px;border:none;background:transparent;
  color:var(--ink-faint);cursor:pointer;border-radius:var(--r-sm);
  opacity:0;transition:opacity .1s;font-size:14px;line-height:1;
}
.item-row:hover .item-remove{opacity:1;}
.item-remove:hover{background:#fdeaea;color:#c22;}
.add-item{
  margin-top:8px;background:none;border:none;color:var(--primary);
  font-size:14px;font-weight:600;cursor:pointer;padding:4px 2px;
  border-radius:var(--r-sm);
}
.add-item:hover{background:rgba(0,117,222,0.08);}

/* ---------- Lab sections ---------- */
.lab-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);color:var(--primary);
  font-size:12px;font-weight:600;letter-spacing:0.125px;
  border-radius:var(--r-full);padding:4px 10px;border:1px solid var(--hairline);
  margin-bottom:6px;
}
.lab-badge .swatch{width:8px;height:8px;border-radius:var(--r-full);}
.lab-toggle{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.lab-toggle .chev{
  color:var(--ink-muted);font-size:13px;transition:transform .15s;
}
.lab.collapsed .chev{transform:rotate(-90deg);}
.lab.collapsed .team-grid{display:none;}

.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-md);margin-top:var(--sp-md);}
.team-card{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:var(--sp-lg);
}
.team-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-md);gap:var(--sp-sm);flex-wrap:wrap;}
.team-name{
  font-size:22px;font-weight:700;line-height:1.27;letter-spacing:-0.25px;color:var(--ink);
}
.pm-field{display:flex;align-items:center;gap:6px;}
.pm-field label{font-size:14px;color:var(--ink-muted);}
.pm-field input{
  width:110px;border:1px solid #dddddd;border-radius:var(--r-xs);
  padding:6px 8px;font-family:inherit;font-size:15px;color:var(--ink);
}
.pm-field input:focus{outline:none;box-shadow:0 0 0 2px rgba(0,117,222,0.15);border-color:var(--primary);}
.subsection{margin-top:var(--sp-md);}
.subsection-label{
  display:inline-block;font-size:12px;font-weight:600;letter-spacing:0.125px;
  color:var(--ink-secondary);background:var(--canvas-soft);
  border-radius:var(--r-full);padding:3px 10px;margin-bottom:8px;
}
.subsection-label.research{color:#005bab;background:#eaf3fd;}
.subsection-label.business{color:var(--accent-orange-deep);background:#fbe9dd;}

/* ---------- Sidebar cards ---------- */
.side-card{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:var(--sp-md);box-shadow:var(--shadow-1);
}
.side-card h4{
  font-size:16px;font-weight:600;margin:0 0 var(--sp-sm);color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-month-label{font-size:13px;color:var(--ink-muted);min-width:70px;text-align:center;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
.cal-dow{font-size:11px;color:var(--ink-faint);padding:2px 0;font-weight:600;}
.cal-day{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink-secondary);border-radius:var(--r-sm);cursor:pointer;
}
.cal-day.pad{visibility:hidden;cursor:default;}
.cal-day:hover{background:var(--canvas-soft);}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700;}
.cal-day .mark{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:var(--r-full);background:var(--accent-teal);
}
.cal-day.weekly .mark{background:var(--primary);}
.cal-day.holiday{color:var(--accent-pink);}
.cal-day.holiday .mark{background:var(--accent-pink);}
.cal-day.today .mark{background:#fff;}

.cal-legend{display:flex;gap:var(--sp-sm);margin-top:var(--sp-sm);font-size:11px;color:var(--ink-muted);flex-wrap:wrap;}
.cal-legend span{display:inline-flex;align-items:center;gap:4px;}
.cal-legend .sw{width:6px;height:6px;border-radius:var(--r-full);display:inline-block;}

.event-note{
  margin-top:var(--sp-sm);
  font-size:13px;color:var(--ink-secondary);
  background:var(--canvas-soft);border-radius:var(--r-md);
  padding:8px 10px;
}
.event-note input{
  width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink-secondary);
}
.event-note input:focus{outline:none;}
.event-note .cal-day-label{font-weight:600;color:var(--ink);margin-bottom:2px;display:block;font-size:12px;}

.annual-month{margin-bottom:var(--sp-sm);}
.annual-month-title{
  font-size:13px;font-weight:700;color:var(--ink);margin:0 0 4px;
}
.annual-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:2px;}
.annual-item .bar{width:3px;flex:0 0 auto;align-self:stretch;border-radius:2px;background:var(--accent-sky);margin-top:2px;}
.annual-item input{
  flex:1 1 auto;border:none;background:transparent;font-family:inherit;
  font-size:13px;color:var(--ink-secondary);padding:2px;border-radius:var(--r-xs);
}
.annual-item input:hover{background:var(--canvas-soft);}
.annual-item input:focus{outline:none;background:var(--canvas-soft);}
.annual-item .item-remove{width:16px;height:16px;font-size:11px;}
.add-annual{
  font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600;padding:2px;
}

/* ---------- Footer ---------- */
.site-footer{
  background:var(--canvas-soft);color:var(--ink-secondary);
  font-size:14px;line-height:1.43;padding:var(--sp-xxl) var(--sp-lg);
  margin-top:var(--sp-lg);border-top:1px solid var(--hairline);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-sm);
}
.site-footer .muted{color:var(--ink-faint);}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-full);
  font-size:14px;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .layout{grid-template-columns:1fr;}
  .side-col{position:static;}
  .card-grid{grid-template-columns:repeat(2,1fr);}
  .team-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .card-grid{grid-template-columns:1fr;}
  .topbar{flex-direction:column;align-items:stretch;}
  .topbar-right{justify-content:flex-end;}
  .week-label{min-width:0;}
}

@media print{
  .topbar,.banner,.side-col,.add-item,.add-annual,.item-remove{display:none !important;}
  .layout{grid-template-columns:1fr;}
  body{background:#fff;}
  .card,.team-card{break-inside:avoid;}
}
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">Weekly <b>회의 자료</b></div>
      <div class="week-nav">
        <button class="icon-btn" id="prevWeek" title="이전 주">‹</button>
        <div class="week-label" id="weekLabel"></div>
        <button class="icon-btn" id="nextWeek" title="다음 주">›</button>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-utility" id="printBtn">인쇄 / 내보내기</button>
      <button class="btn btn-primary" id="submitBtn">제출 완료</button>
    </div>
  </header>

  <div class="banner">
    <div class="dot">!</div>
    <div>각 팀에서는 공유가 필요한 <b>주요 일정</b>을 우측 캘린더에 기입을 부탁드립니다.</div>
  </div>

  <div class="layout">
    <main class="main-col">

      <section class="section" id="orgSection">
        <div class="section-head">
          <p class="eyebrow">주요 일정</p>
          <h2 class="section-title">조직 공통</h2>
          <p class="section-sub">통합사무국 · 홍보 · 연구기획팀</p>
        </div>
        <div class="card-grid" id="orgGrid"></div>
      </section>

      <section class="lab" data-lab="S-Lab" id="labSPC">
        <div class="section-head lab-toggle">
          <div>
            <span class="lab-badge"><span class="swatch" style="background:var(--accent-sky)"></span>LAB</span>
            <h2 class="section-title">S-Lab</h2>
          </div>
          <span class="chev">▾</span>
        </div>
        <div class="team-grid" id="labGrid-S-Lab"></div>
      </section>

      <section class="lab" data-lab="V-Lab" id="labVLab">
        <div class="section-head lab-toggle">
          <div>
            <span class="lab-badge"><span class="swatch" style="background:var(--accent-teal)"></span>LAB</span>
            <h2 class="section-title">V-Lab</h2>
          </div>
          <span class="chev">▾</span>
        </div>
        <div class="team-grid" id="labGrid-V-Lab"></div>
      </section>

      <section class="lab" data-lab="D-Lab" id="labDLab">
        <div class="section-head lab-toggle">
          <div>
            <span class="lab-badge"><span class="swatch" style="background:var(--accent-purple)"></span>LAB</span>
            <h2 class="section-title">D-Lab</h2>
          </div>
          <span class="chev">▾</span>
        </div>
        <div class="team-grid" id="labGrid-D-Lab"></div>
      </section>

    </main>

    <aside class="side-col">
      <div class="side-card">
        <h4>
          캘린더
          <span class="cal-nav">
            <button class="icon-btn" id="prevMonth">‹</button>
            <span class="cal-month-label" id="calMonthLabel"></span>
            <button class="icon-btn" id="nextMonth">›</button>
          </span>
        </h4>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><span class="sw" style="background:var(--primary)"></span>Weekly 회의</span>
          <span><span class="sw" style="background:var(--accent-pink)"></span>공휴일/휴무</span>
          <span><span class="sw" style="background:var(--accent-teal)"></span>사내 일정</span>
        </div>
        <div id="calEventEditor"></div>
      </div>

      <div class="side-card">
        <h4>연간 주요 행사</h4>
        <div id="annualList"></div>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    <span>실팀장 Weekly 자료 · 사내 전용</span>
    <span class="muted" id="savedAt">저장됨</span>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var STORAGE_KEY = 'weeklyReportState_v1';

  var DOW = ['일','월','화','수','목','금','토'];

  var defaultState = {
    org: {
      '통합사무국': ['', '', ''],
      '홍보': ['', '', ''],
      '연구기획팀': ['', '', '']
    },
    labs: {
      'S-Lab': [
        { name: 'SPC팀', pm: '', research: ['', '', ''], business: ['', '', ''] },
        { name: 'EPC팀', pm: '', research: ['', '', ''], business: ['', '', ''] }
      ],
      'V-Lab': [
        { name: '측정센터', pm: '', research: ['', '', ''], business: ['', '', ''] },
        { name: 'SV회계연구팀', pm: '', research: ['', '', ''], business: ['', '', ''] }
      ],
      'D-Lab': [
        { name: '제도화팀', pm: '', research: ['', '', ''], business: ['', '', ''] },
        { name: '거래화팀', pm: '', research: ['', '', ''], business: ['', '', ''] }
      ]
    },
    calEvents: {},
    annual: {
      '4월': [''],
      '5월': ['제주포럼', 'UNEP 환경의 날'],
      '6월': ['전략회의'],
      '7월': [''],
      '8월': ['사회적 가치 페스타(KSVF)'],
      '9월': [''],
      '10월': ['Reuters Sustainability Awards', 'Social Enterprise World Forum(SEWF)'],
      '11월': ['베이징포럼 / 동경포럼(미정)'],
      '12월': ['']
    },
    lastSaved: null,
    labCollapsed: {}
  };

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(defaultState));
      var parsed = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
    }catch(e){
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  function save(){
    state.lastSaved = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    var el = document.getElementById('savedAt');
    if(el) el.textContent = '마지막 저장 · ' + new Date(state.lastSaved).toLocaleTimeString('ko-KR');
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------------- Org cards ---------------- */
  function renderOrg(){
    var grid = document.getElementById('orgGrid');
    grid.innerHTML = '';
    Object.keys(state.org).forEach(function(teamName){
      var card = el('div', 'card');
      card.appendChild(el('div', 'card-title', teamName));
      var list = buildEditableList(state.org[teamName], false, function(newArr){
        state.org[teamName] = newArr; save();
      });
      card.appendChild(list.ul);
      card.appendChild(list.addBtn);
      grid.appendChild(card);
    });
  }

  /* build an editable bullet/numbered list bound to an array */
  function buildEditableList(arr, numbered, onChange){
    var ul = el('ul', 'item-list');
    function renderRows(){
      ul.innerHTML = '';
      arr.forEach(function(val, idx){
        var li = el('li', 'item-row');
        var marker = el('span', 'item-num', numbered ? (idx+1)+'.' : '·');
        var input = document.createElement('input');
        input.type = 'text';
        input.value = val;
        input.placeholder = '이번 주 업데이트를 입력하세요';
        input.addEventListener('input', function(){
          arr[idx] = input.value;
          onChange(arr);
        });
        var rm = el('button', 'item-remove', '✕');
        rm.type = 'button';
        rm.addEventListener('click', function(){
          arr.splice(idx, 1);
          onChange(arr);
          renderRows();
        });
        li.appendChild(marker);
        li.appendChild(input);
        li.appendChild(rm);
        ul.appendChild(li);
      });
    }
    renderRows();
    var addBtn = el('button', 'add-item', '+ 항목 추가');
    addBtn.type = 'button';
    addBtn.addEventListener('click', function(){
      arr.push('');
      onChange(arr);
      renderRows();
      var last = ul.querySelector('.item-row:last-child input');
      if(last) last.focus();
    });
    return { ul: ul, addBtn: addBtn, refresh: renderRows };
  }

  /* ---------------- Lab / team cards ---------------- */
  function renderLabs(){
    Object.keys(state.labs).forEach(function(labName){
      var grid = document.getElementById('labGrid-' + labName);
      grid.innerHTML = '';
      state.labs[labName].forEach(function(team){
        var card = el('div', 'team-card');

        var head = el('div', 'team-head');
        head.appendChild(el('div', 'team-name', team.name));
        var pmField = el('div', 'pm-field');
        pmField.appendChild(el('label', null, 'PM'));
        var pmInput = document.createElement('input');
        pmInput.type = 'text';
        pmInput.placeholder = '이름';
        pmInput.value = team.pm;
        pmInput.addEventListener('input', function(){ team.pm = pmInput.value; save(); });
        pmField.appendChild(pmInput);
        head.appendChild(pmField);
        card.appendChild(head);

        var researchSub = el('div', 'subsection');
        researchSub.appendChild(el('span', 'subsection-label research', '연구'));
        var rList = buildEditableList(team.research, true, function(newArr){ team.research = newArr; save(); });
        researchSub.appendChild(rList.ul);
        researchSub.appendChild(rList.addBtn);
        card.appendChild(researchSub);

        var businessSub = el('div', 'subsection');
        businessSub.appendChild(el('span', 'subsection-label business', '사업'));
        var bList = buildEditableList(team.business, true, function(newArr){ team.business = newArr; save(); });
        businessSub.appendChild(bList.ul);
        businessSub.appendChild(bList.addBtn);
        card.appendChild(businessSub);

        grid.appendChild(card);
      });
    });

    document.querySelectorAll('.lab-toggle').forEach(function(toggle){
      toggle.addEventListener('click', function(){
        var section = toggle.closest('.lab');
        var lab = section.getAttribute('data-lab');
        state.labCollapsed[lab] = !state.labCollapsed[lab];
        section.classList.toggle('collapsed', !!state.labCollapsed[lab]);
        save();
      });
    });
    document.querySelectorAll('.lab').forEach(function(section){
      var lab = section.getAttribute('data-lab');
      section.classList.toggle('collapsed', !!state.labCollapsed[lab]);
    });
  }

  /* ---------------- Week header nav ---------------- */
  var today = new Date();
  var weekStart = mondayOf(today);

  function mondayOf(d){
    var date = new Date(d);
    var day = date.getDay(); // 0 Sun ... 6 Sat
    var diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function fmtMD(d){ return (d.getMonth()+1) + '/' + d.getDate(); }

  function weekOfMonth(d){
    var first = new Date(d.getFullYear(), d.getMonth(), 1);
    var firstMonday = mondayOf(first);
    if(firstMonday.getMonth() !== d.getMonth() && firstMonday > first){
      firstMonday.setDate(firstMonday.getDate() - 7);
    }
    var diffDays = Math.round((d - new Date(d.getFullYear(), d.getMonth(), 1)) / 86400000);
    return Math.floor((diffDays + new Date(d.getFullYear(), d.getMonth(), 1).getDay() + 6) / 7) + 1;
  }

  function renderWeekLabel(){
    var end = new Date(weekStart);
    end.setDate(end.getDate() + 6);
    var wk = Math.ceil((weekStart.getDate()) / 7);
    document.getElementById('weekLabel').textContent =
      weekStart.getFullYear() + '년 ' + (weekStart.getMonth()+1) + '월 ' + wk + '주차 (' + fmtMD(weekStart) + '~' + fmtMD(end) + ')';
  }

  document.getElementById('prevWeek').addEventListener('click', function(){
    weekStart.setDate(weekStart.getDate() - 7); renderWeekLabel();
  });
  document.getElementById('nextWeek').addEventListener('click', function(){
    weekStart.setDate(weekStart.getDate() + 7); renderWeekLabel();
  });

  /* ---------------- Mini calendar ---------------- */
  var calDate = new Date(today.getFullYear(), today.getMonth(), 1);
  var selectedDateKey = null;

  function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

  function renderCalendar(){
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    DOW.forEach(function(d){ grid.appendChild(el('div','cal-dow', d)); });

    var y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('calMonthLabel').textContent = y + '.' + String(m+1).padStart(2,'0');

    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();

    for(var i=0;i<firstDow;i++){ grid.appendChild(el('div','cal-day pad')); }

    for(var day=1; day<=daysInMonth; day++){
      var dow = new Date(y, m, day).getDay();
      var key = dateKey(y,m,day);
      var cell = el('div', 'cal-day');
      cell.textContent = day;
      if(dow === 1) cell.classList.add('weekly'); // Monday recurring meeting
      if(dow === 0 || dow === 6) cell.classList.add('holiday-ish');
      var isToday = (y===today.getFullYear() && m===today.getMonth() && day===today.getDate());
      if(isToday) cell.classList.add('today');

      var hasEvent = state.calEvents[key] && state.calEvents[key].trim();
      if(hasEvent){
        cell.classList.add('holiday');
        cell.appendChild(el('span','mark'));
      } else if(dow === 1){
        cell.appendChild(el('span','mark'));
      }

      cell.addEventListener('click', function(k){
        return function(){ selectedDateKey = k; renderEventEditor(); };
      }(key));

      grid.appendChild(cell);
    }
  }

  function renderEventEditor(){
    var box = document.getElementById('calEventEditor');
    box.innerHTML = '';
    if(!selectedDateKey) return;
    var wrap = el('div','event-note');
    var parts = selectedDateKey.split('-');
    var label = el('span','cal-day-label', parts[1]+'월 '+parts[2]+'일 일정');
    wrap.appendChild(label);
    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '일정을 입력하세요 (예: 지구의 날, EPC CBM)';
    input.value = state.calEvents[selectedDateKey] || '';
    input.addEventListener('input', function(){
      state.calEvents[selectedDateKey] = input.value;
      save();
      renderCalendar();
    });
    wrap.appendChild(input);
    box.appendChild(wrap);
  }

  document.getElementById('prevMonth').addEventListener('click', function(){
    calDate.setMonth(calDate.getMonth()-1); renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    calDate.setMonth(calDate.getMonth()+1); renderCalendar();
  });

  /* ---------------- Annual events ---------------- */
  function renderAnnual(){
    var box = document.getElementById('annualList');
    box.innerHTML = '';
    Object.keys(state.annual).forEach(function(month){
      var group = el('div','annual-month');
      group.appendChild(el('div','annual-month-title', month));
      var arr = state.annual[month];

      function renderItems(){
        var existing = group.querySelectorAll('.annual-item, .add-annual');
        existing.forEach(function(n){ n.remove(); });
        arr.forEach(function(val, idx){
          var row = el('div','annual-item');
          row.appendChild(el('span','bar'));
          var input = document.createElement('input');
          input.type = 'text';
          input.value = val;
          input.placeholder = '행사명';
          input.addEventListener('input', function(){ arr[idx] = input.value; save(); });
          var rm = el('button','item-remove','✕');
          rm.type = 'button';
          rm.addEventListener('click', function(){ arr.splice(idx,1); save(); renderItems(); });
          row.appendChild(input);
          row.appendChild(rm);
          group.appendChild(row);
        });
        var addBtn = el('button','add-annual','+ 추가');
        addBtn.type = 'button';
        addBtn.addEventListener('click', function(){ arr.push(''); save(); renderItems(); });
        group.appendChild(addBtn);
      }
      renderItems();
      box.appendChild(group);
    });
  }

  /* ---------------- Toast ---------------- */
  var toastTimer;
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  document.getElementById('submitBtn').addEventListener('click', function(){
    save();
    showToast('이번 주 Weekly 자료가 제출되었습니다.');
  });
  document.getElementById('printBtn').addEventListener('click', function(){
    window.print();
  });

  /* ---------------- Init ---------------- */
  renderWeekLabel();
  renderOrg();
  renderLabs();
  renderCalendar();
  renderAnnual();
  if(state.lastSaved){
    document.getElementById('savedAt').textContent = '마지막 저장 · ' + new Date(state.lastSaved).toLocaleTimeString('ko-KR');
  } else {
    document.getElementById('savedAt').textContent = '자동 저장 대기 중';
  }
})();
</script>
</body>
